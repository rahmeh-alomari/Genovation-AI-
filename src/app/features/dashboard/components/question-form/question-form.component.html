<p-accordion>
  <p-accordionTab
    *ngFor="let q of questions"
    [header]="q.question + (q.required ? ' *' : '')"
    [ngClass]="{
      'essay-question': isEssayQuestion(q),
      'multiple-choice': isMultipleChoiceQuestion(q)
    }"
  >
    <!-- Essay Question -->
    <textarea
      *ngIf="isEssayQuestion(q)"
      [(ngModel)]="answers[q.id]"
      [attr.maxlength]="getMaxLength(q) ?? null"
      [required]="q.required"
      rows="5"
      placeholder="Write your answer here..."
      aria-label="Essay answer for question"
    ></textarea>
<div class="char-counter" 
     [class.maxed]="(answers[q.id] || '').length >= (getMaxLength(q) ?? 99999)">
  {{ (answers[q.id] || '').length }} / {{ getMaxLength(q) ?? '∞' }}
</div>


    <!-- Multiple Choice -->
    <div *ngIf="isMultipleChoiceQuestion(q)" class="multiple-choice">
      <div
        class="option-item"
        *ngFor="let option of getOptions(q)"
      >
        <input
          [type]="isMultipleSelection(q) ? 'checkbox' : 'radio'"
          [name]="q.id"
          [value]="option"
          (change)="onAnswerChange(q, $event)"
          [checked]="isSelected(q, option)"
  [id]="getSafeId(q.id, option)"
          [attr.aria-checked]="isSelected(q, option)"
        />
        <label [for]="getSafeId(q.id, option)">
          {{ option }}
        </label>
      </div>
    </div>
  </p-accordionTab>
</p-accordion>

<div class="submit-container">
  <button (click)="submit()" pButton label="Submit" class="p-button p-button-primary"   [disabled]="!allRequiredAnswered">
</button>
</div>
